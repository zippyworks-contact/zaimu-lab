<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>財務２級ラボ</title>
  <style>
    :root { --primary: #001a3d; --accent: #3498db; --bg: #f2f5f8; --star: #f1c40f; --yt: #ff0000; }
    html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); font-family: -apple-system, sans-serif; color: #333; }
    body { display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; -webkit-user-select: none; user-select: none; }
    #splash-screen { position: fixed; inset: 0; background: #001a3d; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s; cursor: pointer; }
    #splash-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .header { background: var(--primary); color: white; padding: calc(env(safe-area-inset-top) + 10px) 15px 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .status-area { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-top: 5px; }
    .user-badge { background: var(--accent); padding: 2px 8px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .info-box { background: white; margin: 10px 15px; padding: 12px; border-radius: 12px; border-left: 4px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .yt-btn { background: var(--yt); color: white; margin: 10px 15px; padding: 12px; border-radius: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; gap: 8px; box-shadow: 0 4px 0 #b30000; }
    .scene { width: 100%; height: 320px; display: flex; align-items: center; justify-content: center; perspective: 1000px; margin: 5px 0; }
    .card { width: 88%; height: 95%; position: relative; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); transform-style: preserve-3d; }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: flex-start; padding: 45px 20px; box-sizing: border-box; border-radius: 20px; font-weight: 600; font-size: 1.15rem; box-shadow: 0 8px 20px rgba(0,0,0,0.1); line-height: 1.6; overflow-y: auto; text-align: left; }
    .card-front { background: white; color: var(--primary); }
    .card-back { background: var(--accent); color: white; transform: rotateY(180deg); }
    .card-num { position: absolute; top: 15px; left: 20px; font-size: 0.7rem; font-family: monospace; opacity: 0.6; }
    .star { position: absolute; top: 10px; right: 15px; font-size: 1.8rem; color: #ccc; z-index: 20; }
    .star.active { color: var(--star); }
    .controls { display: flex; justify-content: space-between; gap: 10px; padding: 10px 15px; }
    .btn { background: #bdc3c7; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; flex: 1; cursor: pointer; }
    .btn-blue { background: var(--accent); }
    .screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    input { width: 85%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; }
    .ranking-area { background: white; margin: 15px; padding: 15px; border-radius: 15px; font-size: 0.8rem; }
    table { width: 100%; border-collapse: collapse; }
    th { color: #888; border-bottom: 1px solid #eee; padding: 8px; }
    td { padding: 10px 5px; border-bottom: 1px solid #f9f9f9; text-align: center; }
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    .modal { background: white; width: 85%; max-width: 320px; border-radius: 20px; padding: 25px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="splash-screen" onclick="hideSplash()">
  <img id="splash-img" src="" alt="">
</div>

<div id="auth-screen" class="screen hidden">
  <h2 style="color: var(--primary); margin-bottom:20px;">財務２級ラボ</h2>
  <div id="login-form">
    <input type="text" id="login-nick" placeholder="ニックネーム">
    <input type="password" id="login-pw" placeholder="パスワード">
    <button class="btn btn-blue" style="width: 92%; margin-top:10px" onclick="login()">ログイン</button>
    <p style="font-size:0.8rem; color:var(--accent); margin-top:25px" onclick="showReg()">新規アカウント作成</p>
    <p style="font-size:0.75rem; color:#888" onclick="showReset()">パスワードを忘れた場合</p>
  </div>
  <div id="reg-form" class="hidden">
    <input type="text" id="reg-nick" placeholder="希望ニックネーム">
    <input type="password" id="reg-pw" placeholder="パスワード">
    <input type="text" id="reg-secret" placeholder="秘密の合言葉(復旧用)">
    <p style="font-size:0.65rem; color:#888; text-align:left; width:85%; margin:0 auto 10px;">※英数字・ひらがな・カタカナ・漢字のみ使用可能です。</p>
    <button class="btn btn-blue" style="width: 92%; margin-top:10px" onclick="register()">登録する</button>
    <p style="font-size:0.8rem; color:#888; margin-top:20px" onclick="showLogin()">戻る</p>
  </div>
  <div id="reset-form" class="hidden">
    <input type="text" id="reset-nick" placeholder="ニックネーム">
    <input type="text" id="reset-secret" placeholder="秘密の合言葉">
    <input type="password" id="reset-newpw" placeholder="新しいパスワード">
    <button class="btn btn-blue" style="width: 92%; margin-top:10px" onclick="resetPw()">再設定</button>
    <p style="font-size:0.8rem; color:#888; margin-top:20px" onclick="showLogin()">戻る</p>
  </div>
</div>

<div id="app-screen" class="hidden">
  <div class="header">
    <h1 style="margin:0; font-size:1rem;">財務２級ラボ</h1>
    <div class="status-area">
      <div id="countdown"></div>
      <div>🔥 <span id="streak-cur">0</span>日 (最高<span id="streak-max">0</span>日)</div>
      <div class="user-badge" id="user-display" onclick="promptNick()"></div>
    </div>
  </div>

  <div class="main-content">
    <div class="info-box">
      <small style="color:var(--accent); font-weight:bold">今日のあなたへの言葉</small>
      <div id="quote-display" style="font-weight:bold; margin-top:5px; font-size:0.85rem">...</div>
    </div>

    <a id="yt-link" href="#" target="_blank" class="yt-btn hidden">📺 YouTube解説を見る</a>

    <div style="margin: 0 15px;">
      <select id="cat-select" onchange="changeCat()" style="width:100%; padding:12px; border-radius:10px; border:2px solid var(--accent); font-weight:bold; background:white; outline:none;">
        <option value="all">すべて表示</option>
        <option value="review">復習対象 ⭐</option>
      </select>
    </div>

    <div class="scene">
      <div class="card" id="card" onclick="handleTap()">
        <div class="card-face card-front">
          <div class="card-num" id="num-f">No.</div>
          <div class="star" id="star-f" onclick="toggleStar(event)">★</div>
          <div id="text-f" style="margin-top:10px"></div>
        </div>
        <div class="card-face card-back">
          <div class="card-num" id="num-b">No.</div>
          <div class="star" id="star-b" onclick="toggleStar(event)">★</div>
          <div id="text-b" style="margin-top:10px"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="handleBack()">← 戻る</button>
      <button class="btn" onclick="resetToFirst()">先頭へ</button>
      <label style="font-size:0.8rem; font-weight:bold; display:flex; align-items:center;"><input type="checkbox" id="rand-mode" style="margin-right:5px"> ランダム</label>
    </div>

    <div class="ranking-area">
      <h3 style="margin-top:0; font-size:0.9rem">🏆 解答数ランキング TOP20</h3>
      <table id="rank-table"></table>
      <button class="btn" style="margin-top:30px; width:100%" onclick="logout()">ログアウト</button>
    </div>
  </div>
</div>

<div id="modal-overlay" class="hidden">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-msg" style="margin-bottom:20px; font-size:0.9rem; line-height:1.5; color:#555"></p>
    <button class="btn btn-blue" style="width:100%" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
  // 【重要】ここにGASのウェブアプリURLを貼り付ける
  const API_URL = "https://script.google.com/macros/s/AKfycbzok2guVTJERc8hpOSDKybor7IPGwVYutn3THuNLEXKuMmT2cfAO_o86sYvQZj0HLmlxQ/exec";

  let state = { nickname: '', all: [], filtered: [], quotes: [], bookmarks: [], currentIndex: 0, rotation: 0, isAns: false };

  function isValidNickname(str) {
    return /^[a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]+$/.test(str);
  }

  window.onload = () => {
    const img = document.getElementById('splash-img');
    img.src = (window.innerHeight > window.innerWidth) ? 'splash-v.png' : 'splash-h.png';
    setTimeout(hideSplash, 2500);
  };

  function hideSplash() {
    document.getElementById('splash-screen').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('splash-screen').classList.add('hidden');
      const saved = localStorage.getItem('zaimu_nick');
      if (saved) { state.nickname = saved; loadApp(); }
      else { document.getElementById('auth-screen').classList.remove('hidden'); }
    }, 600);
  }

  async function loadApp() {
    const res = await fetch(API_URL + "?action=getAppData");
    const data = await res.json();
    state.all = data.problems;
    state.quotes = data.quotes;
    
    const select = document.getElementById('cat-select');
    while(select.options.length > 2) select.remove(2);
    data.categories.forEach(c => {
      const opt = document.createElement('option'); opt.value = c; opt.innerText = c;
      select.appendChild(opt);
    });

    if (data.youtubeUrl) {
      const yt = document.getElementById('yt-link'); yt.href = data.youtubeUrl; yt.classList.remove('hidden');
    }

    const pw = localStorage.getItem('zaimu_pw');
    const uRes = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nickname: state.nickname, pw: pw }) });
    const u = await uRes.json();
    if (u === 'fail') { logout(); return; }

    state.currentIndex = Number(u.lastIndex) || 0;
    state.bookmarks = u.bookmarks ? u.bookmarks.toString().split(',').map(Number).filter(n=>n) : [];
    document.getElementById('streak-cur').innerText = u.streak;
    document.getElementById('streak-max').innerText = u.maxStreak;
    document.getElementById('user-display').innerText = state.nickname;

    renderRank(data.ranking);
    updateCountdown();
    showQuote();
    changeCat();
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
  }

  async function login() {
    const nick = document.getElementById('login-nick').value.trim();
    const pw = document.getElementById('login-pw').value;
    if(!nick || !pw) return openModal("エラー", "入力を完了してください");
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nickname: nick, pw }) });
    const u = await res.json();
    if (u === 'fail') return openModal("失敗", "ニックネームまたはPWが違います");
    localStorage.setItem('zaimu_nick', nick); localStorage.setItem('zaimu_pw', pw);
    state.nickname = nick; loadApp();
  }

  async function register() {
    const nick = document.getElementById('reg-nick').value.trim(), pw = document.getElementById('reg-pw').value, sec = document.getElementById('reg-secret').value;
    if (!nick || !pw || !sec) return openModal("エラー", "全項目入力が必要です");
    if (!isValidNickname(nick)) return openModal("不可", "ニックネームに使用できない文字があります");
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'register', nickname: nick, pw, secret: sec }) });
    const text = await res.text();
    if (text === 'exists') return openModal("不可", "この名前は既に使用されています");
    openModal("完了", "登録しました。ログインしてください"); showLogin();
  }

  async function resetPw() {
    const nick = document.getElementById('reset-nick').value.trim(), sec = document.getElementById('reset-secret').value, npw = document.getElementById('reset-newpw').value;
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'resetPw', nickname: nick, secret: sec, newPw: npw }) });
    const text = await res.text();
    if (text === 'success') { openModal("成功", "PWを更新しました"); showLogin(); }
    else openModal("失敗", "情報が一致しません");
  }

  function changeCat() {
    const val = document.getElementById('cat-select').value;
    if (val === 'all') state.filtered = state.all;
    else if (val === 'review') state.filtered = state.all.filter(p => state.bookmarks.includes(p.id));
    else state.filtered = state.all.filter(p => p.cat === val);
    state.currentIndex = 0; state.isAns = false; state.rotation = 0;
    document.getElementById('card').style.transform = `rotateY(0deg)`;
    updateCard();
  }

  function updateCard() {
    if (state.filtered.length === 0) {
      document.getElementById('text-f').innerText = "問題がありません"; document.getElementById('text-b').innerText = "";
      return;
    }
    const p = state.filtered[state.currentIndex];
    const isFront = Math.abs(state.rotation / 180) % 2 === 0;
    const num = `No. ${document.getElementById('cat-select').value === 'all' ? p.id : state.currentIndex + 1}`;
    document.getElementById('num-f').innerText = num; document.getElementById('num-b').innerText = num;
    document.getElementById(isFront ? 'text-f' : 'text-b').innerText = isFront ? p.q : p.a;
    const isB = state.bookmarks.includes(p.id);
    document.getElementById('star-f').classList.toggle('active', isB); document.getElementById('star-b').classList.toggle('active', isB);
    localStorage.setItem('zaimu_lastIndex', state.currentIndex);
  }

  function handleTap() {
    if (state.filtered.length === 0) return;
    if (!state.isAns) { state.isAns = true; state.rotation += 180; updateCard(); sync(1); }
    else {
      state.isAns = false; state.rotation += 180;
      if (document.getElementById('rand-mode').checked) state.currentIndex = Math.floor(Math.random() * state.filtered.length);
      else state.currentIndex = (state.currentIndex + 1) % state.filtered.length;
      updateCard();
    }
    document.getElementById('card').style.transform = `rotateY(${state.rotation}deg)`;
  }

  function handleBack() {
    if (state.filtered.length === 0) return;
    if (state.isAns) { state.isAns = false; state.rotation -= 180; }
    else { state.isAns = true; state.rotation -= 180; state.currentIndex = (state.currentIndex - 1 + state.filtered.length) % state.filtered.length; }
    updateCard(); document.getElementById('card').style.transform = `rotateY(${state.rotation}deg)`;
  }

  async function sync(delta) {
    fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', oldNickname: localStorage.getItem('zaimu_nick'), nickname: state.nickname, countDelta: delta, lastIndex: state.currentIndex, bookmarks: state.bookmarks.join(',') }) });
  }

  function toggleStar(e) {
    e.stopPropagation();
    const id = state.filtered[state.currentIndex].id;
    const i = state.bookmarks.indexOf(id);
    if (i > -1) state.bookmarks.splice(i, 1); else state.bookmarks.push(id);
    updateCard(); sync(0);
  }

  function updateCountdown() {
    const diff = Math.ceil((new Date('2026/12/06') - new Date().setHours(0,0,0,0)) / 86400000);
    document.getElementById('countdown').innerText = diff > 0 ? `試験まで ${diff}日` : "試験当日";
  }

  function renderRank(data) {
    document.getElementById('rank-table').innerHTML = '<tr><th>位</th><th>名前</th><th>回数</th><th>継続</th></tr>' + 
      data.map((r, i) => `<tr ${r.name === state.nickname ? 'style="background:#fff9c4;font-weight:bold;"':''}><td>${i+1}</td><td>${r.name}</td><td>${r.count}</td><td>${r.streak}日</td></tr>`).join('');
  }

  function showQuote() { document.getElementById('quote-display').innerText = state.quotes[Math.floor(Math.random() * state.quotes.length)]; }
  function showReg() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('reg-form').classList.remove('hidden'); }
  function showLogin() { document.getElementById('reg-form').classList.add('hidden'); document.getElementById('reset-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); }
  function showReset() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('reset-form').classList.remove('hidden'); }
  function logout() { localStorage.clear(); location.reload(); }
  function openModal(t, m) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-msg').innerText = m; document.getElementById('modal-overlay').classList.remove('hidden'); }
  function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
  function resetToFirst() { state.currentIndex = 0; state.isAns = false; state.rotation = 0; document.getElementById('card').style.transform = `rotateY(0deg)`; updateCard(); sync(0); }
  
  async function promptNick() {
    const n = prompt("新しいニックネーム(英数・日のみ)", state.nickname);
    if(n && n !== state.nickname) {
      if(!isValidNickname(n)) return alert("使用できない文字があります");
      const old = state.nickname; state.nickname = n; document.getElementById('user-badge').innerText = n;
      fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', oldNickname: old, nickname: n, countDelta: 0, lastIndex: state.currentIndex, bookmarks: state.bookmarks.join(',') }) });
      localStorage.setItem('zaimu_nick', n); alert("変更しました");
    }
  }
</script>
</body>
</html>
